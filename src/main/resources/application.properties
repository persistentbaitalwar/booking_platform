spring.application.name=movie-booking

# Default: in-memory H2 (PostgreSQL-compatible behaviour for row locks). Use --spring.profiles.active=postgres for PostgreSQL.
spring.datasource.url=jdbc:h2:mem:movies;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# H2 web console for local development: http://localhost:8080/h2-console (switch off outside development)
spring.h2.console.enabled=${H2_CONSOLE:true}
spring.h2.console.settings.web-allow-others=false

app.seed-demo-data=true

app.qr.secret=${QR_SECRET:dev-only-secret-change-me-in-production-0123456789}
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# ---- Kafka (ticket events). Disabled by default so the app also runs without a broker. ----
app.kafka.enabled=false
app.kafka.relay-delay-ms=1000
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:9092}
spring.kafka.producer.acks=all
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.consumer.group-id=ticket-processing
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.ack-mode=record

# ---- Swagger UI: http://localhost:8080/swagger-ui.html (set SWAGGER_ENABLED=false in production) ----
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.persist-authorization=true

# ---- Security (JWT). Replace every secret below through environment variables in real environments. ----
app.security.jwt-secret=${JWT_SECRET:dev-only-jwt-secret-change-me-in-production-0123456789abcdef}
app.security.token-minutes=60
app.security.max-failed-logins=5
app.security.lockout-minutes=15
app.security.bootstrap-admin-email=${BOOTSTRAP_ADMIN_EMAIL:}
app.security.bootstrap-admin-password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.ratelimit.auth-per-minute=30
app.ratelimit.booking-per-minute=120

# ---- Payments. hold = seats are held until the gateway confirms payment (webhook); immediate = charge inside the booking ----
app.payments.mode=${PAYMENT_MODE:hold}
app.payments.hold-minutes=10
app.payments.expiry-check-ms=30000
app.payments.webhook-secret=${PAYMENT_WEBHOOK_SECRET:dev-only-webhook-secret-change-me-0123456789}
app.payments.simulator-enabled=${PAYMENT_SIMULATOR:true}

# ---- Operations ----
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
server.forward-headers-strategy=framework
server.error.include-stacktrace=never
server.error.include-message=never
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
logging.pattern.level=%5p [%X{requestId}]
app.kafka.replicas=${KAFKA_REPLICAS:1}
