# Local run with Kafka:  mvn spring-boot:run -Dspring-boot.run.profiles=local
# Needs a Kafka broker on localhost:9094 (docker compose up -d kafka kafka-ui) or set KAFKA_BOOTSTRAP,
# for example KAFKA_BOOTSTRAP=localhost:9092 for a Kafka you installed yourself (see docs/LOCAL_KAFKA.md).
app.kafka.enabled=true
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:9094}
app.kafka.relay-delay-ms=500
app.seed-demo-data=true
app.payments.mode=hold
app.payments.simulator-enabled=true
logging.level.org.apache.kafka=WARN
logging.level.org.springframework.kafka=INFO
